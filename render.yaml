services:
  - type: web
    name: chess-evolution
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.22.3"
      - key: NODE_ENV
        value: production
      - key: TRAINING_API_KEY
        sync: false
